name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # R15: lockfile-exact install only
      - run: npm ci
      # Pipeline order: codegen → graph build → anchor verify → views → app
      # build → tests → gates. The engine steps regenerate what is committed,
      # so drift between sources, graph, census and views fails here; the app
      # build runs before the tests and gates so the dist-reading honesty
      # tests and the r6 unlinked-figure scan cover the freshly built pages.
      - run: npm run codegen
      - run: npm run graph
      - run: npm run verify
      - run: npm run build:views
      # App build only — static output to app/dist, never published from here (R8).
      - run: npm run build
      - run: node --test
      # R19 is base-aware: it checks the links of the build it was handed.
      - run: node engine/gates/run.mjs

# ── THE one deploy path (R8 / AD-11): GitHub Pages, built by this workflow ───
# Credentials: none. Pages publishes through the workflow's own identity, so
# no token exists anywhere, locally or as a secret.
#
# The owner's enabling act is two settings, both in this repository:
#   1. Settings → Pages → Source: GitHub Actions
#   2. Settings → Secrets and variables → Actions → Variables → new variable
#      DEPLOY_PAGES = true
# Until that variable is set this job is skipped, so nothing deploys by
# accident and CI stays green. Optional variables SITE_ORIGIN and SITE_BASE
# override the address when a custom domain replaces the project path.
# See docs/LAUNCH.md §2.
  deploy:
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SITE_ORIGIN: ${{ vars.SITE_ORIGIN || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      SITE_BASE: ${{ vars.SITE_BASE || format('/{0}', github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The exact pipeline the checks job verified, rebuilt here; GITHUB_SHA is
      # in the environment, so the footer stamps this commit's hash (AD-11).
      - run: npm run codegen
      - run: npm run graph
      - run: npm run verify
      - run: npm run build:views
      # build:pages = the same static build, then the base-path prefix.
      - run: npm run build:pages
      - run: node --test
      # Gates run against the artifact that is about to ship, base and all:
      # a dead link under the deploy path fails here, before anyone sees it.
      - run: node engine/gates/run.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deploy
        uses: actions/deploy-pages@v4
