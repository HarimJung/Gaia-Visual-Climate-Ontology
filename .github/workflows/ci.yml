name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # R15: lockfile-exact install only
      - run: npm ci
      # Pipeline order: codegen → graph build → anchor verify → views → app
      # build → tests → gates. The engine steps regenerate what is committed,
      # so drift between sources, graph, census and views fails here; the app
      # build runs before the tests and gates so the dist-reading honesty
      # tests and the r6 unlinked-figure scan cover the freshly built pages.
      - run: npm run codegen
      - run: npm run graph
      - run: npm run verify
      - run: npm run build:views
      # App build only — static output to app/dist, never published from here (R8).
      - run: npm run build
      - run: node --test
      - run: node engine/gates/run.mjs

